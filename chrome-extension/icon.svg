<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#07050f" stroke="rgba(255, 255, 255, 0.08)" stroke-width="8"/>
  <!-- Glowing Letter A -->
  <text x="50%" y="62%" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">A</text>
</svg>
